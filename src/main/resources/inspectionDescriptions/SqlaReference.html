<html><body>
Reports SQLAlchemy string references that don't resolve: <code>relationship("Class")</code>, <code>back_populates</code>,
<code>secondary</code>, <code>ForeignKey("table.column")</code>, and keyword arguments to <code>filter_by()</code>.
These are otherwise only caught when mappers are configured at runtime or when the query runs.
</body></html>
