name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The build downloads PyCharm and the verifier downloads several more IDEs; runs failed twice with
      # "No space left on device". Remove large preinstalled toolchains this project never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4

      # No local PyCharm on the runner, so the build falls back to a downloaded platform
      # (see build.gradle.kts). UNVERIFIED until this repo is pushed to GitHub and CI runs once.
      - name: Lint and format check (ktlint)
        run: ./gradlew ktlintCheck

      - name: Unit tests
        run: ./gradlew test

      - name: JetBrains plugin verifier
        run: ./gradlew verifyPlugin

      - name: Build plugin
        run: ./gradlew buildPlugin

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-and-reports
          path: |
            build/distributions/*.zip
            build/reports/**
